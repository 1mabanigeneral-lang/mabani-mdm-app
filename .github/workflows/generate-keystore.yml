name: Generate release keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore mdm-release.jks \
            -alias mabanimdm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "Azerty002007!MDM" \
            -keypass "Azerty002007!MDM" \
            -dname "CN=1MABANI, OU=IT, O=1MABANI, L=Abu Dhabi, ST=Abu Dhabi, C=AE"
          base64 -w0 mdm-release.jks > mdm-release.jks.b64
          echo "::notice::Copy the content of the uploaded mdm-release.jks.b64 file into the repository secret KEYSTORE_BASE64, and set KEYSTORE_PASSWORD to Azerty002007!MDM"

      - name: Upload keystore (base64) as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdm-release-keystore-base64
          path: mdm-release.jks.b64
